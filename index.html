<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vorm</title>
  <meta name="description" content="Volg je gewicht en lichaamsmaten.">
  <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vorm">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title" id="viewTitle">Overzicht</h1>
  </header>

  <main class="views" id="views">
    <section class="view" data-view="overview" aria-labelledby="viewTitle"></section>
    <section class="view" data-view="log" hidden></section>
    <section class="view" data-view="compare" hidden></section>
    <section class="view" data-view="settings" hidden></section>
  </main>

  <button class="fab" id="fab" type="button" aria-label="Nieuwe meting">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" aria-label="Hoofdmenu">
    <button type="button" class="tab" data-tab="overview" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>
      <span>Overzicht</span>
    </button>
    <button type="button" class="tab" data-tab="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M7 8v3M11 8v4M15 8v3M19 8v2"/></svg>
      <span>Metingen</span>
    </button>
    <button type="button" class="tab" data-tab="compare">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M17 4v16M3 8l4-4 4 4M13 16l4 4 4-4"/></svg>
      <span>Vergelijk</span>
    </button>
    <button type="button" class="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Instellingen</span>
    </button>
  </nav>

  <!-- Meting toevoegen / bewerken -->
  <dialog class="sheet" id="measureSheet" aria-labelledby="measureTitle">
    <form class="sheet__form" id="measureForm" novalidate>
      <header class="sheet__head">
        <button type="button" class="link" data-close>Annuleer</button>
        <h2 id="measureTitle">Nieuwe meting</h2>
        <button type="submit" class="link link--strong">Bewaar</button>
      </header>
      <div class="sheet__body">
        <label class="field">
          <span class="field__label">Datum</span>
          <input type="date" name="date" required>
        </label>
        <div id="measureFields"></div>
        <label class="field">
          <span class="field__label">Notitie</span>
          <textarea name="note" rows="2" placeholder="Bijv. 's ochtends, nuchter"></textarea>
        </label>
        <p class="hint">Vul alleen in wat je gemeten hebt. Grijze waarden zijn je vorige meting.</p>
        <button type="button" class="button button--danger" id="measureDelete" hidden>Meting verwijderen</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
